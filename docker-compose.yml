services:

  postgres:
    image: postgres:16-alpine
    container_name: fleet-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - private_net

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5


  pgadmin:
    image: dpage/pgadmin4
    container_name: fleet-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

    ports:
      - "5050:80"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - public_net
      - private_net


  app:
    build:
      context: ./app

    container_name: fleet-app
    restart: unless-stopped

    environment:
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      PORT: 3000
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - public_net
      - private_net


  nginx:
    image: nginx:alpine
    container_name: fleet-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"


    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro


    depends_on:
      - app

    networks:
      - public_net


  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: fleet-cadvisor
    restart: unless-stopped

    privileged: true

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

    networks:
      - public_net


  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: fleet-nginx-exporter
    restart: unless-stopped

    command:
      - "--nginx.scrape-uri=http://nginx/nginx_status"

    depends_on:
      - nginx

    networks:
      - public_net


  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: fleet-postgres-exporter
    restart: unless-stopped

    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - private_net


  prometheus:
    image: prom/prometheus:latest
    container_name: fleet-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    depends_on:
      - cadvisor
      - nginx-exporter
      - postgres-exporter

    networks:
      - public_net
      - private_net


  grafana:
    image: grafana/grafana:latest
    container_name: fleet-grafana
    restart: unless-stopped

    ports:
      - "3001:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

    networks:
      - public_net


  loki:
    image: grafana/loki:3.0.0
    container_name: fleet-loki
    restart: unless-stopped

    command:
      - "-config.file=/etc/loki/local-config.yaml"

    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

    networks:
      - public_net


  promtail:
    image: grafana/promtail:3.0.0
    container_name: fleet-promtail
    restart: unless-stopped

    command:
      - "-config.file=/etc/promtail/config.yml"

    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_data:/tmp

    depends_on:
      - loki

    networks:
      - public_net


networks:

  public_net:

  private_net:
    internal: true


volumes:

  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_data:
